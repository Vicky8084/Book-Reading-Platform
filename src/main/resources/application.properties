spring.application.name=online-book-reading-platform

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/book_reading_platform
spring.datasource.username=root
spring.datasource.password=${LOCAL_DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

jwt.secret=${LOCAL_JWT_SECRET:localdevsecretonlyfordevtestingpurpose12345}
jwt.expiration-ms=86400000

# Local dev runs on http://localhost, so cookies can't be 'secure'
cookie.secure=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:youremail@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=${APP_BASE_URL:http://localhost:8081}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Pool enable karna zaroori hai, warna upar wali saari settings ignore ho jaayengi
spring.data.redis.lettuce.pool.enabled=true

# Ek time pe max kitne active connections rakhne hain
spring.data.redis.lettuce.pool.max-active=20

# Idle rehte hue bhi kitne connections open rakhne hain (taaki naya connection
# banane ka overhead baar-baar na aaye)
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# Agar sab connections busy hain, naya request kitni der wait karega
# connection milne ke liye, uske baad timeout error dega
spring.data.redis.lettuce.pool.max-wait=1000ms

# Redis se response na aane par kitni der wait karna hai (hanging requests
# se bachne ke liye - production me yeh na ho toh ek slow Redis call poori
# request thread ko hamesha ke liye block kar sakta hai)
spring.data.redis.timeout=2000ms