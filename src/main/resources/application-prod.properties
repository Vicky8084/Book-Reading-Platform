spring.application.name=online-book-reading-platform

server.port=${PORT:8081}

spring.datasource.url=jdbc:mysql://mysql-2225d0bd-mrvickygupta1111-ef45.c.aivencloud.com:17258/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Production runs on https, so cookies must be 'secure'
cookie.secure=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.base-url=${APP_BASE_URL:https://book-reading-platform.onrender.com}