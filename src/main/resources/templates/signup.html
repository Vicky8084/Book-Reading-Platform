<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Intelli-Read</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>
<body>

<header>
    <a th:href="@{/}">
        <img th:src="@{/images/logo.png}" alt="IntelliRead Logo" style="height:80px; width:auto;">
    </a>
    <div class="nav-buttons">
        <button class="btn btn-loginoutline" title="Login & Signup" onclick="window.location.href='/login'">
            <img th:src="@{/images/login.png}" alt="login-icon" style="height: 50px; width: auto;">
        </button>
    </div>
</header>

<div class="signup-container">
    <div class="signup-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join us today</p>

        <form class="signup-form" id="signupForm">
            <div class="role-selection">
                <label>Select Role</label>
                <div class="role-options">
                    <div class="role-option" data-role="USER">
                        <input type="radio" id="role-user" name="role" value="USER" required checked>
                        <i class='bx bx-user-circle role-icon'></i>
                        <span>USER</span>
                    </div>
                    <div class="role-option" data-role="PUBLISHER">
                        <input type="radio" id="role-publisher" name="role" value="PUBLISHER" required>
                        <i class='bx bx-book-alt role-icon'></i>
                        <span>PUBLISHER</span>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <i class='bx bx-user'></i>
                <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
            </div>

            <div class="input-group">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <i class='bx bx-phone'></i>
                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Phone Number" required>
            </div>

            <div class="input-group">
                <i class='bx bx-calendar'></i>
                <input type="number" id="age" name="age" placeholder="Age" min="13" max="100" required>
            </div>

            <div class="input-group">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="password" name="password" placeholder="Password" required minlength="8">
                <i class='bx bx-hide toggle-eye' id="togglePassword"></i>
            </div>

            <div class="input-group">
                <i class='bx bx-lock'></i>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                <i class='bx bx-hide toggle-eye' id="toggleConfirmPassword"></i>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="terms" id="terms" required>
                    I agree to the <a href="#" class="terms-link"> Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
            <p class="login-link">Already have an account? <a href="/login">Sign in here</a></p>
        </form>
    </div>
</div>

<footer class="main-footer">
    <div class="footer-section">
        <h4>About</h4>
        <p>Designed and Developed by <b style="color: rgb(206, 232, 10); font-size: large;">Vicky Gupta</b></p>
    </div>
    <div class="footer-section">
        <p>&copy; <span>2026</span> Intelli-Read. All Rights Reserved.</p>
        <p><a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a></p>
    </div>
    <div class="footer-section">
        <h4>License</h4>
        <p>Standard License</p>
    </div>
</footer>

<!-- ===== CUSTOM STYLED POPUP (replaces native browser alert) ===== -->
<div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
        <div class="custom-alert-header">
            <img th:src="@{/images/logo.png}" alt="IntelliRead" class="custom-alert-logo">
            <span>IntelliRead says</span>
        </div>
        <div class="custom-alert-body">
            <div class="custom-alert-icon" id="customAlertIcon">
                <i class='bx bx-check-circle'></i>
            </div>
            <p class="custom-alert-message" id="customAlertMessage"></p>
        </div>
        <button type="button" class="custom-alert-btn" id="customAlertOkBtn">OK</button>
    </div>
</div>

<script th:src="@{/js/signup.js}"></script>
</body>
</html>
