<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading | Intelli-Read</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/readbook.css}">
</head>
<body>

<header class="reader-header">
    <button class="icon-btn" id="backBtn" title="Back">
        <i class='bx bx-arrow-back'></i>
    </button>
    <div class="reader-title">
        <h1 id="bookTitle">Loading…</h1>
        <span id="bookAuthor"></span>
    </div>
    <div class="reader-header-right">
        <span id="pageIndicator">– / –</span>
    </div>
</header>

<main class="reader-main">
    <div class="reader-loading" id="readerLoading">
        <div class="spinner"></div>
        <p>Opening book…</p>
    </div>

    <div class="page-stage" id="pageStage" style="display:none;">
        <div class="page-card">
            <canvas id="pdfCanvas"></canvas>
            <div class="watermark-overlay" id="watermarkOverlay">Intelli-Read</div>
        </div>
    </div>
</main>

<footer class="reader-toolbar" id="readerToolbar" style="display:none;">
    <div class="toolbar-group">
        <button class="icon-btn" id="zoomOutBtn" title="Zoom out"><i class='bx bx-zoom-out'></i></button>
        <button class="icon-btn" id="zoomInBtn" title="Zoom in"><i class='bx bx-zoom-in'></i></button>
    </div>

    <div class="toolbar-group page-nav">
        <button class="icon-btn" id="prevPageBtn" title="Previous page"><i class='bx bx-chevron-left'></i></button>
        <input type="range" id="pageSlider" min="1" max="1" value="1">
        <button class="icon-btn" id="nextPageBtn" title="Next page"><i class='bx bx-chevron-right'></i></button>
    </div>

    <div class="toolbar-group color-modes">
        <button class="mode-btn active" data-mode="light" title="Light">
            <i class='bx bx-sun'></i>
        </button>
        <button class="mode-btn" data-mode="sepia" title="Sepia">
            <i class='bx bx-coffee'></i>
        </button>
        <button class="mode-btn" data-mode="dark" title="Dark">
            <i class='bx bx-moon'></i>
        </button>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script th:src="@{/js/readbook.js}"></script>
</body>
</html>
