<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | Intelli-Read</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/books.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
</head>
<body>
<header>
    <div class="logo">
        <a th:href="@{/home}"><img th:src="@{/images/logo.png}" alt="Logo"></a>
    </div>
    <div class="nav-buttons">
        <form class="header-search" id="headerSearchForm">
            <input type="text" id="header-search" placeholder="Search books...">
            <button type="submit"><i class='bx bx-search'></i></button>
        </form>
        <button class="btn btn-loginoutline" title="Login & Signup" onclick="window.location.href='/login'">
            <img th:src="@{/images/login.png}" alt="login-icon" style="height: 50px; width: auto;">
        </button>
    </div>
</header>

<div class="main-content">
    <div class="tags-section">
        <h2>Browse by Category</h2>
        <div id="tags" class="tags">
            <div class="tag highlight" data-category="all">All Books</div>
        </div>
    </div>

    <div class="books-container">
        <div class="books-header">
            <h1>Discover Amazing Books</h1>
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
            <p>Loading books...</p>
        </div>

        <main id="main" class="main">
        </main>

        <div class="pagination" id="pagination">
        </div>
    </div>
</div>

<footer class="main-footer" style="font-family: chakra petch;">
    <div class="footer-section">
        <h4>About</h4>
        <p>Designed and Developed by <b class="team-highlight">Vicky Gupta</b></p>
    </div>
    <div class="footer-section">
        <p>&copy; <span id="year"></span> Intelli-Read. All Rights Reserved.</p>
        <p><a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a></p>
    </div>
    <div class="footer-section">
        <h4>License</h4>
        <p>Standard License</p>
    </div>
</footer>

<script th:src="@{/js/books.js}"></script>
</body>
</html>
