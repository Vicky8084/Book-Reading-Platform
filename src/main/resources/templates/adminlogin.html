<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Intelli-Read</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/adminlogin.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>

<!-- ===== HEADER (Same as forgotpassword) ===== -->
<header>
    <div class="logo">
        <a href="/home"><img src="/images/logo.png" alt="Logo"></a>
    </div>
    <div class="nav-buttons">
        <button class="btn btn-loginoutline" title="Login & Signup" onclick="window.location.href='/login'">
            <img src="/images/login.png" alt="login-icon" style="height: 50px; width: auto;">
        </button>
    </div>
</header>

<!-- ===== ADMIN PANEL ===== -->
<div class="main-content">
    <div class="admin-container">
        <div class="admin-card">
            <h2>Welcome Admin 🙎‍♂️</h2>
            <p class="admin-subtext">Manage users, monitor activity, and keep Intelli-Read running smoothly.</p>

            <form class="admin-form" id="adminForm">
                <div class="form-group icon-input">
                    <i class='bx bx-envelope'></i>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group icon-input">
                    <i class='bx bx-lock-alt'></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <i class='bx bx-hide toggle-eye' id="togglePassword"></i>
                </div>

                <button type="button" class="submit-btn" onclick="validateAndLogin()" id="loginBtn">
                    Login
                </button>

                <div id="errorMessage" style="color: red; text-align: center; margin-top: 10px; display: none;"></div>

                <p class="signup-link">Back to User login - <a href="#" onclick="window.location.href='/login'">Click Here</a></p>
            </form>
        </div>
    </div>
</div>

<!-- ===== FOOTER (Same as forgotpassword) ===== -->
<footer class="main-footer" style="font-family: chakra petch;">
    <div class="footer-section">
        <h4>About</h4>
        <p>Designed and Developed by <b style="color: rgb(206, 232, 10); font-size: large;">Vicky Gupta</b></p>
    </div>
    <div class="footer-section">
        <p>&copy; <span id="year"></span> Intelli-Read. All Rights Reserved.</p>
        <p><a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a></p>
    </div>
    <div class="footer-section">
        <h4>License</h4>
        <p>Standard License</p>
    </div>
</footer>

<script src="/js/adminlogin.js"></script>
</body>
</html>
